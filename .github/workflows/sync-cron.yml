name: Sincronização automática (Anota AI)

# Substitui a Tarefa Agendada do Windows usada em desenvolvimento — chama
# /api/cron/sync do site publicado a cada ~10 minutos. Gratuito, funciona em
# qualquer plano da Vercel (o cron nativo da Vercel no plano Hobby só roda
# 1x/dia). Requer os secrets SYNC_APP_URL e CRON_SECRET configurados no
# repositório (Settings → Secrets and variables → Actions).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/sync
        run: |
          curl -sf -X GET "${{ secrets.SYNC_APP_URL }}/api/cron/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
